name: Deploy webapp to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mobile-ux-remote-access-BMzwE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enable Pages automatically (no manual Settings toggle needed)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # npm ci is strict about lockfile sync; fall back so a stale or
      # missing lockfile can't break the preview build.
      - name: Install dependencies
        working-directory: webapp
        run: npm ci || npm install

      - name: Build
        working-directory: webapp
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
